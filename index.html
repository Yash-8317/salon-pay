<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review & Pay</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1a1a;--muted:#666;--border:#e2e2e2;--blue:#2563eb;--green:#1a8f4c;--grey:#9aa0a6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1e;--text:#f2f2f2;--muted:#aaa;--border:#333}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1e;--text:#f2f2f2;--muted:#aaa;--border:#333}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center;box-sizing:border-box}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.step{border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0;text-align:left;transition:opacity .3s}
.step h2{font-size:16px;margin:0 0 6px}
.note{font-size:13px;color:var(--muted);margin:0}
.btn{display:block;width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font-size:17px;font-weight:600;text-decoration:none;border:0;cursor:pointer;color:#fff;margin-top:12px;text-align:center}
.review{background:var(--blue)}
.pay{background:var(--green)}
.pay.disabled{background:var(--grey);pointer-events:none}
.locked{opacity:.45;pointer-events:none}
.hidden{display:none}
input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--card);color:var(--text)}
.qr{display:block;width:100%;max-width:300px;margin:12px auto 0}
.skip{display:inline-block;margin-top:10px;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.big{font-size:20px;font-weight:600;margin:0 0 8px}
.timer{font-size:28px;font-weight:700;margin-top:10px}
</style>
</head>
<body>

<!-- COUNTER SCREEN (old phone on the counter) -->
<div class="card hidden" id="counterView">
  <p class="big" id="counterTitle">Scan to leave a review</p>
  <img class="qr" id="counterQr" alt="QR">
  <p class="note" id="counterNote"></p>
  <div class="timer hidden" id="timer"></div>
</div>

<!-- CUSTOMER PAGE -->
<div class="card" id="customerView">
  <h1 id="bizName"></h1>
  <p class="sub">Thank you for visiting!</p>

  <div class="step" id="step1">
    <h2>Step 1: Leave us a review</h2>
    <p class="note">Tap below. It opens in a new tab. Post your review, then close that tab to come back here.</p>
    <a class="btn review" id="reviewBtn" target="_blank" rel="noopener">Leave a review ⭐</a>
  </div>

  <div class="step locked" id="step2">
    <h2>Step 2: Pay</h2>
    <label class="note" for="amt">Enter amount (₹)</label>
    <input id="amt" type="number" inputmode="decimal" min="1" placeholder="0">
    <a class="btn pay disabled" id="payBtn" href="#">Pay now</a>
    <button class="skip" id="skipBtn" type="button">Already reviewed? Tap here</button>
  </div>
</div>

const $ = (id) => document.getElementById(id);
const DB = CONFIG.dbUrl.replace(/\/$/, "");
const isCounter = new URLSearchParams(location.search).get("display") === "1";

async function dbGet() {
  const r = await fetch(DB + "/state.json", { cache: "no-store" });
  return r.json();
}
async function dbMarkReviewed() {
  await fetch(DB + "/state.json", {
    method: "PUT",
    body: JSON.stringify({ reviewedAt: { ".sv": "timestamp" } })
  });
}

/* ---------- COUNTER SCREEN ---------- */

  $("counterView").classList.remove("hidden");
  $("counterQr").src = CONFIG.reviewQrImage;

  let lastShown = null;
  async function tick() {
    let st = null;
    try { st = await dbGet(); } catch (e) { $("counterNote").textContent = "Connection problem, retrying..."; }
    const reviewedAt = st && st.reviewedAt ? Number(st.reviewedAt) : 0;
    const remaining = reviewedAt + CONFIG.holdSeconds * 1000 - Date.now();

    if (reviewedAt && remaining > 0) {
      if (lastShown !== "bank") {
        $("counterTitle").textContent = "Pay here";
        $("counterQr").src = CONFIG.bankQrImage;
        $("counterNote").textContent = "Scan with any UPI app and enter the amount.";
        lastShown = "bank";
      }
      $("timer").classList.remove("hidden");
      $("timer").textContent = Math.ceil(remaining / 1000) + "s";
    } else if (lastShown !== "review") {
      $("counterTitle").textContent = "Scan to leave a review";
      $("counterQr").src = CONFIG.reviewQrImage;
      $("counterNote").textContent = "";
      $("timer").classList.add("hidden");
      lastShown = "review";
    }
    setTimeout(tick, 1000);
  }
  tick();
}

/* ---------- CUSTOMER PAGE ---------- */
function runCustomer() {
  let reviewOpened = false;

  function upiLink(amount) {
    return "upi://pay?pa=" + encodeURIComponent(CONFIG.upiId) +
           "&pn=" + encodeURIComponent(CONFIG.payeeName) +
           "&am=" + encodeURIComponent(amount) +
           "&cu=INR&tn=" + encodeURIComponent("Payment to " + CONFIG.businessName);
  }
  function refreshPay() {
    const a = ($("amt").value || "").trim();
    const ready = a && Number(a) > 0;
    $("payBtn").classList.toggle("disabled", !ready);
    $("payBtn").textContent = ready ? "Pay ₹" + a + " now" : "Pay now";
    $("payBtn").href = ready ? upiLink(a) : "#";
  }
  function unlockPay() {
    $("step2").classList.remove("locked");
    $("skipBtn").classList.add("hidden");
    refreshPay();
  }

  $("bizName").textContent = CONFIG.businessName;
  $("reviewBtn").href = CONFIG.reviewUrl;
  $("amt").addEventListener("input", refreshPay);

  $("reviewBtn").addEventListener("click", () => {
    reviewOpened = true;
    dbMarkReviewed().catch(() => {});
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && reviewOpened) unlockPay();
  });
  $("skipBtn").addEventListener("click", unlockPay);
  refreshPay();
}

if (isCounter) runCounter(); else runCustomer();
</script>
